  <path d="M0 30 Q75 10 150 30 Q225 50 300 30 Q375 10 450 30 Q525 50 600 30 Q675 10 750 30 Q825 50 900 30 Q975 10 1050 30 Q1125 50 1200 30 L1200 0 L0 0Z" fill="#039be5" opacity="0.5"/>
