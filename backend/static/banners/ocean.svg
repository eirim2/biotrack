    <circle cx="160" cy="75" r="2.5"/>
    <circle cx="400" cy="90" r="5"/>
    <circle cx="410" cy="110" r="3"/>
    <circle cx="700" cy="70" r="3.5"/>
    <circle cx="690" cy="50" r="2"/>
