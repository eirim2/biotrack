    <path d="M100 200 Q105 170 115 175 Q120 160 130 170 Q135 155 145 165 Q150 200"/>
    <path d="M350 200 Q355 165 365 175 Q370 150 380 165 Q390 200"/>
    <path d="M650 200 Q660 175 670 180 Q675 160 685 170 Q695 200"/>
    <path d="M950 200 Q960 170 970 178 Q975 155 985 168 Q990 200"/>
    <circle cx="200" cy="190" r="12" fill="#0277bd" opacity="0.3"/>
    <circle cx="215" cy="185" r="8" fill="#0277bd" opacity="0.3"/>
