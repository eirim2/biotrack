<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a472a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Distant hills -->
  <path d="M0 140 Q150 90 300 130 Q450 80 600 120 Q750 70 900 110 Q1050 75 1200 100 L1200 200 L0 200Z" fill="#245a2e" opacity="0.5"/>
  <!-- Tree silhouettes - back row -->
  <g fill="#1a3d1f" opacity="0.7">
    <polygon points="80,200 100,80 120,200"/>
    <polygon points="150,200 175,60 200,200"/>
    <polygon points="280,200 310,70 340,200"/>
    <polygon points="420,200 445,55 470,200"/>
    <polygon points="550,200 580,75 610,200"/>
    <polygon points="700,200 725,50 750,200"/>
    <polygon points="850,200 880,65 910,200"/>
    <polygon points="980,200 1010,70 1040,200"/>
    <polygon points="1100,200 1130,55 1160,200"/>
  </g>
  <!-- Tree silhouettes - front row -->
  <g fill="#0d2614">
    <polygon points="30,200 60,100 90,200"/>
    <polygon points="180,200 220,85 260,200"/>
    <polygon points="350,200 385,95 420,200"/>
    <polygon points="490,200 520,80 550,200"/>
    <polygon points="630,200 665,90 700,200"/>
    <polygon points="770,200 800,75 830,200"/>
    <polygon points="920,200 955,85 990,200"/>
    <polygon points="1060,200 1095,95 1130,200"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="185" width="1200" height="15" fill="#0a1f0c"/>
  <!-- Fireflies -->
  <circle cx="200" cy="110" r="2" fill="#a5d6a7" opacity="0.8"/>
  <circle cx="500" cy="95" r="1.5" fill="#c8e6c9" opacity="0.6"/>
  <circle cx="800" cy="105" r="2" fill="#a5d6a7" opacity="0.7"/>
  <circle cx="1000" cy="90" r="1.5" fill="#c8e6c9" opacity="0.5"/>
</svg>
