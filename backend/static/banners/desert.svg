<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fab54d"/>
      <stop offset="70%" stop-color="#e8a940"/>
      <stop offset="100%" stop-color="#d4943a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="200" cy="50" r="30" fill="#fff8e1" opacity="0.9"/>
  <circle cx="200" cy="50" r="40" fill="#fff8e1" opacity="0.15"/>
  <!-- Distant dunes -->
  <path d="M0 140 Q150 100 350 130 Q500 95 700 125 Q900 90 1050 120 Q1150 100 1200 115 L1200 200 L0 200Z" fill="#c9913a" opacity="0.5"/>
  <!-- Main dunes -->
  <path d="M0 165 Q200 130 400 160 Q550 125 750 155 Q950 120 1100 150 Q1200 135 1200 145 L1200 200 L0 200Z" fill="#b8842f"/>
  <!-- Cacti silhouettes -->
  <g fill="#8b6d28" opacity="0.7">
    <!-- Cactus 1 - saguaro -->
    <rect x="320" y="120" width="8" height="50"/>
    <rect x="310" y="128" width="8" height="4" rx="2"/>
    <rect x="310" y="115" width="4" height="17"/>
    <rect x="328" y="130" width="8" height="4" rx="2"/>
    <rect x="332" y="120" width="4" height="14"/>
    <!-- Cactus 2 -->
    <rect x="780" y="115" width="7" height="55"/>
    <rect x="770" y="125" width="7" height="4" rx="2"/>
    <rect x="770" y="110" width="4" height="19"/>
    <rect x="787" y="120" width="7" height="4" rx="2"/>
    <rect x="790" y="108" width="4" height="16"/>
    <!-- Small cactus -->
    <rect x="550" y="148" width="5" height="25"/>
    <rect x="543" y="152" width="5" height="3" rx="1"/>
    <rect x="543" y="143" width="3" height="12"/>
  </g>
  <!-- Front sand detail -->
  <path d="M0 180 Q300 172 600 182 Q900 170 1200 178 L1200 200 L0 200Z" fill="#a07225"/>
  <!-- Sand texture dots -->
  <g fill="#c49a3c" opacity="0.3">
    <circle cx="100" cy="185" r="1.5"/>
    <circle cx="300" cy="188" r="1"/>
    <circle cx="500" cy="183" r="1.5"/>
    <circle cx="700" cy="186" r="1"/>
    <circle cx="900" cy="182" r="1.5"/>
    <circle cx="1100" cy="185" r="1"/>
  </g>
</svg>
