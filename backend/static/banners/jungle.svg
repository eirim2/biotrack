<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Misty background -->
  <g fill="#4caf50" opacity="0.15">
    <ellipse cx="300" cy="100" rx="200" ry="60"/>
    <ellipse cx="800" cy="90" rx="250" ry="70"/>
  </g>
  <!-- Background canopy -->
  <path d="M0 110 Q100 70 200 100 Q300 60 400 95 Q500 55 600 90 Q700 50 800 85 Q900 55 1000 90 Q1100 60 1200 95 L1200 200 L0 200Z" fill="#1a4d1e" opacity="0.6"/>
  <!-- Palm frond silhouettes - left -->
  <g fill="#0d3311" opacity="0.8">
    <!-- Left palm -->
    <path d="M0 0 Q30 30 20 80 Q40 60 60 90 Q50 50 80 70 Q55 30 0 0"/>
    <path d="M80 0 Q60 40 70 90 Q50 65 30 95 Q45 55 20 70 Q50 25 80 0"/>
    <!-- Right palm -->
    <path d="M1200 0 Q1170 30 1180 80 Q1160 60 1140 90 Q1150 50 1120 70 Q1145 30 1200 0"/>
    <path d="M1120 0 Q1140 40 1130 90 Q1150 65 1170 95 Q1155 55 1180 70 Q1150 25 1120 0"/>
  </g>
  <!-- Large tropical leaves - mid layer -->
  <g fill="#145218" opacity="0.7">
    <path d="M150 200 Q170 130 220 110 Q200 140 250 130 Q210 160 260 160 Q200 170 150 200"/>
    <path d="M450 200 Q460 120 510 100 Q490 140 530 125 Q500 155 540 150 Q490 170 450 200"/>
    <path d="M750 200 Q780 140 830 120 Q800 150 850 135 Q810 165 860 155 Q810 175 750 200"/>
    <path d="M1000 200 Q1020 130 1070 110 Q1040 145 1090 130 Q1050 160 1100 150 Q1050 175 1000 200"/>
  </g>
  <!-- Hanging vines -->
  <g fill="none" stroke="#0a2e0d" stroke-width="2" opacity="0.5">
    <path d="M100 0 Q95 40 105 80 Q100 120 110 160"/>
    <path d="M350 0 Q345 50 355 100 Q350 140 360 180"/>
    <path d="M680 0 Q675 45 685 90 Q680 130 690 170"/>
    <path d="M1080 0 Q1075 35 1085 70 Q1080 110 1090 150"/>
  </g>
  <!-- Foreground dense foliage -->
  <path d="M0 170 Q50 150 100 165 Q150 145 200 160 Q250 140 300 155 Q350 138 400 152 Q450 135 500 150 Q550 132 600 148 Q650 130 700 145 Q750 128 800 142 Q850 125 900 140 Q950 130 1000 145 Q1050 125 1100 140 Q1150 130 1200 145 L1200 200 L0 200Z" fill="#0d3311"/>
  <!-- Tiny flowers -->
  <g opacity="0.6">
    <circle cx="180" cy="155" r="2.5" fill="#f44336"/>
    <circle cx="520" cy="148" r="2" fill="#ff9800"/>
    <circle cx="830" cy="142" r="2.5" fill="#e91e63"/>
    <circle cx="1070" cy="145" r="2" fill="#ffeb3b"/>
  </g>
</svg>
