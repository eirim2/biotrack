<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8872D"/>
      <stop offset="60%" stop-color="#D3503D"/>
      <stop offset="100%" stop-color="#9A512A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Distant mesa formations -->
  <g fill="#8B3A2A" opacity="0.5">
    <rect x="50" y="100" width="180" height="100" rx="2"/>
    <rect x="30" y="105" width="220" height="5"/>
    <rect x="400" y="85" width="150" height="115" rx="2"/>
    <rect x="385" y="90" width="180" height="5"/>
    <rect x="800" y="95" width="200" height="105" rx="2"/>
    <rect x="780" y="100" width="240" height="5"/>
  </g>
  <!-- Main mesa formations -->
  <g fill="#7A2E1E">
    <rect x="100" y="120" width="160" height="80" rx="2"/>
    <rect x="85" y="125" width="190" height="4"/>
    <rect x="500" y="105" width="180" height="95" rx="2"/>
    <rect x="480" y="110" width="220" height="4"/>
    <rect x="900" y="115" width="140" height="85" rx="2"/>
    <rect x="885" y="120" width="170" height="4"/>
  </g>
  <!-- Rock layers/striations -->
  <g fill="#9C4030" opacity="0.4">
    <rect x="100" y="145" width="160" height="3"/>
    <rect x="100" y="160" width="160" height="2"/>
    <rect x="500" y="135" width="180" height="3"/>
    <rect x="500" y="155" width="180" height="2"/>
    <rect x="900" y="140" width="140" height="3"/>
  </g>
  <!-- Ground -->
  <path d="M0 180 Q300 172 600 182 Q900 170 1200 178 L1200 200 L0 200Z" fill="#6B2418"/>
  <!-- Scattered rocks -->
  <g fill="#8B3A2A" opacity="0.6">
    <polygon points="300,185 315,175 330,185"/>
    <polygon points="720,182 730,174 740,182"/>
    <polygon points="1080,184 1090,178 1100,184"/>
  </g>
</svg>
