<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#3949AB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Aurora / northern lights -->
  <g opacity="0.15">
    <path d="M0 30 Q200 10 400 40 Q600 15 800 35 Q1000 5 1200 25 L1200 80 Q1000 50 800 75 Q600 45 400 70 Q200 40 0 65Z" fill="#69f0ae"/>
    <path d="M0 40 Q300 20 600 50 Q900 20 1200 40 L1200 90 Q900 55 600 80 Q300 50 0 75Z" fill="#b388ff"/>
  </g>
  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="100" cy="25" r="1.5"/>
    <circle cx="250" cy="15" r="1"/>
    <circle cx="400" cy="30" r="1.5"/>
    <circle cx="550" cy="10" r="1"/>
    <circle cx="700" cy="28" r="1.5"/>
    <circle cx="850" cy="18" r="1"/>
    <circle cx="1000" cy="22" r="1.5"/>
    <circle cx="1150" cy="12" r="1"/>
  </g>
  <!-- Distant mountains -->
  <g fill="#3f51b5" opacity="0.4">
    <polygon points="0,160 100,80 200,160"/>
    <polygon points="150,160 280,70 410,160"/>
    <polygon points="500,160 620,65 740,160"/>
    <polygon points="700,160 850,75 1000,160"/>
    <polygon points="950,160 1080,70 1200,160"/>
  </g>
  <!-- Foreground mountains with snow caps -->
  <g fill="#5c6bc0">
    <polygon points="0,200 150,90 300,200"/>
    <polygon points="250,200 420,80 590,200"/>
    <polygon points="550,200 700,85 850,200"/>
    <polygon points="800,200 960,75 1120,200"/>
    <polygon points="1050,200 1150,95 1200,130 1200,200"/>
  </g>
  <!-- Snow caps -->
  <g fill="#e8eaf6" opacity="0.8">
    <polygon points="130,100 150,90 170,100"/>
    <polygon points="400,90 420,80 440,90"/>
    <polygon points="680,95 700,85 720,95"/>
    <polygon points="940,85 960,75 980,85"/>
  </g>
  <!-- Ice/snow ground -->
  <path d="M0 185 Q300 178 600 188 Q900 175 1200 183 L1200 200 L0 200Z" fill="#c5cae9" opacity="0.3"/>
</svg>
