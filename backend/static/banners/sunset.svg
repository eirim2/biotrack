<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="40%" stop-color="#f7a072"/>
      <stop offset="70%" stop-color="#f7c59f"/>
      <stop offset="100%" stop-color="#e8c4a0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#sky)"/>
  <!-- Sun half-set -->
  <circle cx="600" cy="130" r="50" fill="#fff3e0" opacity="0.6"/>
  <circle cx="600" cy="130" r="38" fill="#ffe0b2" opacity="0.5"/>
  <circle cx="600" cy="130" r="28" fill="#ffcc80" opacity="0.4"/>
  <!-- Sun reflection glow -->
  <ellipse cx="600" cy="130" rx="200" ry="30" fill="#ffcc80" opacity="0.1"/>
  <!-- Horizon clouds -->
  <g fill="#ff8a65" opacity="0.3">
    <ellipse cx="150" cy="100" rx="100" ry="10"/>
    <ellipse cx="400" cy="85" rx="80" ry="8"/>
    <ellipse cx="800" cy="90" rx="120" ry="12"/>
    <ellipse cx="1050" cy="95" rx="90" ry="9"/>
  </g>
  <!-- Bird silhouettes -->
  <g fill="none" stroke="#5d4037" stroke-width="1.5" opacity="0.5">
    <path d="M300 60 Q310 50 320 58 Q330 50 340 60"/>
    <path d="M350 50 Q358 42 366 48 Q374 42 382 50"/>
    <path d="M280 72 Q288 64 296 70 Q304 64 312 72"/>
    <path d="M850 55 Q860 45 870 53 Q880 45 890 55"/>
    <path d="M880 68 Q888 60 896 66 Q904 60 912 68"/>
  </g>
  <!-- Water / horizon -->
  <path d="M0 145 L1200 145 L1200 200 L0 200Z" fill="#bf5a30" opacity="0.3"/>
  <!-- Water ripples -->
  <g fill="none" stroke="#ffcc80" stroke-width="0.8" opacity="0.2">
    <path d="M100 155 Q200 152 300 155 Q400 158 500 155"/>
    <path d="M400 165 Q500 162 600 165 Q700 168 800 165"/>
    <path d="M200 175 Q350 172 500 175 Q650 178 800 175"/>
    <path d="M600 155 Q700 152 800 155 Q900 158 1000 155"/>
  </g>
  <!-- Ground silhouette -->
  <path d="M0 180 Q300 175 600 182 Q900 172 1200 178 L1200 200 L0 200Z" fill="#4e342e" opacity="0.4"/>
</svg>
